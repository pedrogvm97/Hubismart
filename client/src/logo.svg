<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="hubiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Nexus Shield with Glowing Gradient Outline -->
  <polygon points="256,46 438,151 438,361 256,466 74,361 74,151" 
           fill="#0f172a" fill-opacity="0.9" 
           stroke="url(#hubiGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Concentric Accent Ring -->
  <polygon points="256,70 418,163 418,349 256,442 94,349 94,163" 
           fill="none" 
           stroke="#06b6d4" stroke-width="4" stroke-opacity="0.6" stroke-linejoin="round" />

  <!-- Camera Surveillance Aperture Outer Ring -->
  <circle cx="256" cy="256" r="120" fill="#1e293b" stroke="url(#hubiGrad)" stroke-width="8" />

  <!-- Camera Aperture Blades (Surveillance Iris) -->
  <g stroke="#06b6d4" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="360" y1="256" x2="288" y2="288" />
    <line x1="308" y1="346" x2="242" y2="295" />
    <line x1="204" y1="346" x2="210" y2="263" />
    <line x1="152" y1="256" x2="224" y2="224" />
    <line x1="204" y1="166" x2="270" y2="217" />
    <line x1="308" y1="166" x2="302" y2="249" />
  </g>

  <!-- Core Camera Lens & Smart Pulse Sensor -->
  <circle cx="256" cy="256" r="54" fill="url(#coreGrad)" stroke="#ffffff" stroke-width="5" filter="url(#glow)" />

  <!-- Central Smart Bolt / Activity Spark -->
  <polygon points="262,222 238,258 252,258 246,290 274,254 260,254" fill="#ffffff" />
</svg>
