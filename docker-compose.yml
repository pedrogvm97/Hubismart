version: '3.8'

services:
  hubismart:
    image: ghcr.io/pedrogvm97/hubismart:latest
    container_name: Hubismart
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3020
      - HUBITAT_IP=192.168.1.128:65
      - HUBITAT_APP_ID=YOUR_APP_ID
      - HUBITAT_ACCESS_TOKEN=YOUR_ACCESS_TOKEN
    restart: unless-stopped
